<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>खाना खजाना | ऑनलाइन ऑर्डर</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Same styles as before, plus offline banner */
        .offline-banner {
            background: #ff4757;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .item-disabled {
            opacity: 0.6;
            pointer-events: none;
            filter: grayscale(0.2);
        }
        /* rest of styles remain same */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #fff5eb 0%, #ffe6d5 100%); padding: 20px; min-height: 100vh; }
        .container { max-width: 1300px; margin: 0 auto; }
        .auth-card { max-width: 450px; margin: 60px auto; background: rgba(255,255,255,0.95); border-radius: 32px; padding: 40px 30px; box-shadow: 0 25px 45px rgba(0,0,0,0.1); text-align: center; }
        .auth-card h2 { color: #800000; margin-bottom: 8px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 16px; font-size: 16px; }
        .btn-primary { background: #800000; color: white; border: none; padding: 14px; border-radius: 40px; font-weight: 600; width: 100%; cursor: pointer; }
        .resto-header { background: white; border-radius: 32px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo h1 { color: #800000; }
        .welcome-section { display: flex; align-items: center; gap: 15px; background: #f9f3ef; padding: 8px 20px; border-radius: 50px; }
        .logout-btn { background: #eee; border: none; padding: 6px 18px; border-radius: 40px; cursor: pointer; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; margin: 30px 0; }
        .menu-card { background: white; border-radius: 28px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.2s; }
        .item-name { font-weight: 700; font-size: 18px; }
        .prices { display: flex; gap: 15px; margin: 10px 0; }
        .price-tag { background: #f0e6e1; padding: 4px 12px; border-radius: 30px; font-size: 14px; color: #800000; }
        .qty-selector { display: flex; gap: 15px; margin-top: 12px; flex-wrap: wrap; }
        .selector-group { display: flex; align-items: center; gap: 10px; background: #f8f8f8; padding: 6px 15px; border-radius: 50px; }
        .qty-btn { background: #800000; color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .qty-btn.minus { background: #aaa; }
        .qty-value { font-weight: 600; min-width: 30px; text-align: center; }
        .cart-section { background: white; border-radius: 32px; padding: 25px; margin: 30px 0; }
        .cart-items-list { max-height: 200px; overflow-y: auto; margin-bottom: 15px; }
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .total-row { font-size: 20px; font-weight: 700; text-align: right; margin: 15px 0; }
        .orders-history { background: white; border-radius: 32px; padding: 25px; margin-top: 30px; }
        .order-history-card { border-left: 5px solid #f39c12; margin: 15px 0; padding: 15px; background: #fef9f4; border-radius: 20px; }
        .order-history-card.ready { border-left-color: #2ecc71; background: #e8f5e9; }
        .order-history-card.approved { border-left-color: #3498db; background: #eaf2f8; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 30px; font-size: 12px; font-weight: 600; }
        .status-pending { background: #f39c12; color: white; }
        .status-approved { background: #3498db; color: white; }
        .status-ready { background: #2ecc71; color: white; }
        .category-title { font-size: 28px; font-weight: 600; margin: 30px 0 15px 0; color: #800000; border-left: 5px solid #800000; padding-left: 15px; }
        @media (max-width: 700px) { .resto-header { flex-direction: column; gap: 15px; text-align: center; } }
    </style>

        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, where, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARhEin-GkSNftXo5AwJjGkYz0Jec1RwC8",
            authDomain: "khana-khazana-b9ab9.firebaseapp.com",
            projectId: "khana-khazana-b9ab9",
            storageBucket: "khana-khazana-b9ab9.firebasestorage.app",
            messagingSenderId: "439774060344",
            appId: "1:439774060344:web:4ad0fe0378a26d33b2abcd",
            measurementId: "G-45MJLVWF75"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM elements
        const authContainer = document.getElementById('authContainer');
        const orderContainer = document.getElementById('orderContainer');
        const step1Div = document.getElementById('step1');
        const step2LoginDiv = document.getElementById('step2Login');
        const step3SignupDiv = document.getElementById('step3Signup');
        const mobileInput = document.getElementById('mobileNumber');
        const continueBtn = document.getElementById('continueBtn');
        const loginPassword = document.getElementById('loginPassword');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');
        const signupName = document.getElementById('signupName');
        const signupPassword = document.getElementById('signupPassword');
        const signupSubmitBtn = document.getElementById('signupSubmitBtn');
        const backToMobileBtn = document.getElementById('backToMobile');
        const backToMobileFromSignup = document.getElementById('backToMobileFromSignup');
        const errorMsg = document.getElementById('errorMsg');
        const welcomeUser = document.getElementById('welcomeUser');
        const logoutBtn = document.getElementById('logoutBtn');
        const offlineBanner = document.getElementById('offlineBanner');
        const placeOrderBtn = document.getElementById('placeOrderBtn');
        
        let currentCustomer = null;
        let unsubscribeOrders = null;
        let restaurantOnline = true;
        let outOfStockItems = [];
        let menuItems = []; // will be populated

        function getEmailFromMobile(mobile) { return `${mobile}@khanakhazana.com`; }

        // Fetch restaurant settings (online/offline + out of stock)
        async function fetchRestaurantSettings() {
            try {
                const settingsRef = doc(db, "settings", "restaurantStatus");
                const snap = await getDoc(settingsRef);
                if (snap.exists()) {
                    const data = snap.data();
                    restaurantOnline = data.online === true;
                    outOfStockItems = data.outOfStock || [];
                } else {
                    // Default settings if not exists
                    await setDoc(settingsRef, { online: true, outOfStock: [] });
                    restaurantOnline = true;
                    outOfStockItems = [];
                }
                updateOfflineUI();
            } catch(e) { console.error("Settings error", e); }
        }

        function updateOfflineUI() {
            if (!restaurantOnline) {
                offlineBanner.style.display = 'block';
                if (placeOrderBtn) placeOrderBtn.disabled = true;
                // Disable all quantity buttons
                document.querySelectorAll('.qty-btn').forEach(btn => btn.disabled = true);
            } else {
                offlineBanner.style.display = 'none';
                if (placeOrderBtn) placeOrderBtn.disabled = false;
                document.querySelectorAll('.qty-btn').forEach(btn => btn.disabled = false);
            }
        }

        // Listen to realtime settings changes
        function subscribeToSettings() {
            const settingsRef = doc(db, "settings", "restaurantStatus");
            onSnapshot(settingsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    restaurantOnline = data.online === true;
                    outOfStockItems = data.outOfStock || [];
                    updateOfflineUI();
                    // Rebuild menu to reflect out-of-stock
                    if (window.menuBuilt) buildMenuWithSelectors();
                }
            });
        }

        // Step 1: Check mobile
        continueBtn.addEventListener('click', async () => {
            const mobile = mobileInput.value.trim();
            if (!mobile || !/^\d{10}$/.test(mobile)) {
                errorMsg.innerText = "10 अंकों का मोबाइल नंबर डालें";
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';
            currentMobile = mobile;
            try {
                const customerRef = doc(db, "customers", mobile);
                const snap = await getDoc(customerRef);
                if (snap.exists()) {
                    step1Div.style.display = 'none';
                    step2LoginDiv.style.display = 'block';
                } else {
                    step1Div.style.display = 'none';
                    step3SignupDiv.style.display = 'block';
                }
            } catch(err) {
                errorMsg.innerText = "सर्वर त्रुटि";
                errorMsg.style.display = 'block';
            }
        });

        loginSubmitBtn.addEventListener('click', async () => {
            const password = loginPassword.value.trim();
            if (!password) { document.getElementById('loginError').innerText = "पासवर्ड डालें"; document.getElementById('loginError').style.display = 'block'; return; }
            const email = getEmailFromMobile(currentMobile);
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch(err) {
                document.getElementById('loginError').innerText = "गलत पासवर्ड";
                document.getElementById('loginError').style.display = 'block';
            }
        });

        signupSubmitBtn.addEventListener('click', async () => {
            const name = signupName.value.trim();
            const password = signupPassword.value.trim();
            if (!name || !password) { document.getElementById('signupError').innerText = "नाम और पासवर्ड दोनों भरें"; document.getElementById('signupError').style.display = 'block'; return; }
            if (password.length < 6) { document.getElementById('signupError').innerText = "पासवर्ड 6+ अक्षर"; document.getElementById('signupError').style.display = 'block'; return; }
            const email = getEmailFromMobile(currentMobile);
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "customers", currentMobile), { name, mobile: currentMobile, email, createdAt: new Date().toISOString() });
            } catch(err) {
                document.getElementById('signupError').innerText = err.message;
                document.getElementById('signupError').style.display = 'block';
            }
        });

        backToMobileBtn.addEventListener('click', () => {
            step2LoginDiv.style.display = 'none';
            step1Div.style.display = 'block';
            loginPassword.value = '';
        });
        backToMobileFromSignup.addEventListener('click', () => {
            step3SignupDiv.style.display = 'none';
            step1Div.style.display = 'block';
            signupName.value = '';
            signupPassword.value = '';
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            if (unsubscribeOrders) unsubscribeOrders();
            orderContainer.style.display = 'none';
            authContainer.style.display = 'block';
            step1Div.style.display = 'block';
            step2LoginDiv.style.display = 'none';
            step3SignupDiv.style.display = 'none';
            mobileInput.value = '';
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const email = user.email;
                const mobile = email.split('@')[0];
                const customerRef = doc(db, "customers", mobile);
                const snap = await getDoc(customerRef);
                if (snap.exists()) {
                    currentCustomer = { mobile, name: snap.data().name };
                } else {
                    currentCustomer = { mobile, name: mobile };
                }
                authContainer.style.display = 'none';
                orderContainer.style.display = 'block';
                welcomeUser.innerText = `${currentCustomer.name} (${mobile})`;
                await fetchRestaurantSettings();
                subscribeToSettings();
                initOrderSystem();
                loadCustomerOrders(mobile);
            } else {
                if (orderContainer.style.display !== 'none') {
                    orderContainer.style.display = 'none';
                    authContainer.style.display = 'block';
                }
            }
        });

        // ---------- Menu Data (Full 41 items) ----------
        const fullMenu = [
            { name: "मटन बिरयानी", fullPrice: 210, halfPrice: 120, category: "बिरयानी और स्टार्टर" },
            { name: "चिकन दम बिरयानी", fullPrice: 130, halfPrice: 80, category: "बिरयानी और स्टार्टर" },
            { name: "चिकन फ्राई बिरयानी", fullPrice: 140, halfPrice: 85, category: "बिरयानी और स्टार्टर" },
            { name: "अंडा बिरयानी", fullPrice: 110, halfPrice: 80, category: "बिरयानी और स्टार्टर" },
            { name: "चिकन मनचुरीयन", fullPrice: 150, halfPrice: 85, category: "बिरयानी और स्टार्टर" },
            { name: "चिकन चिल्ली", fullPrice: 170, halfPrice: 95, category: "बिरयानी और स्टार्टर" },
            { name: "चिकन 65", fullPrice: 160, halfPrice: 90, category: "बिरयानी और स्टार्टर" },
            { name: "चिकन तेल फ्राई", fullPrice: 170, halfPrice: 95, category: "बिरयानी और स्टार्टर" },
            { name: "चिकन मसाला फ्राई", fullPrice: 160, halfPrice: 90, category: "बिरयानी और स्टार्टर" },
            { name: "बटर चिकन", fullPrice: 170, halfPrice: 95, category: "नॉन-वेज" },
            { name: "कढ़ाई चिकन", fullPrice: 170, halfPrice: 95, category: "नॉन-वेज" },
            { name: "चिकन मसाला", fullPrice: 160, halfPrice: 90, category: "नॉन-वेज" },
            { name: "चिकन दो प्याजा", fullPrice: 160, halfPrice: 90, category: "नॉन-वेज" },
            { name: "अंडा कढ़ी", fullPrice: 110, halfPrice: 80, category: "नॉन-वेज" },
            { name: "अंडा मसाला", fullPrice: 110, halfPrice: 80, category: "नॉन-वेज" },
            { name: "मटन कढ़ी", fullPrice: 200, halfPrice: 110, category: "नॉन-वेज" },
            { name: "चिकन फ्राई राइस", fullPrice: 130, halfPrice: 80, category: "नॉन-वेज" },
            { name: "चिकन अंडा फ्राई राइस", fullPrice: 140, halfPrice: 85, category: "नॉन-वेज" },
            { name: "चिकन थाली", fullPrice: 120, halfPrice: null, category: "नॉन-वेज" },
            { name: "आमलेट", fullPrice: 50, halfPrice: 35, category: "नॉन-वेज" },
            { name: "शाही पनीर", fullPrice: 170, halfPrice: 95, category: "भेज (Veg)" },
            { name: "पनीर प्याजा", fullPrice: 160, halfPrice: 90, category: "भेज (Veg)" },
            { name: "पनीर मसाला", fullPrice: 160, halfPrice: 90, category: "भेज (Veg)" },
            { name: "पनीर बटर मसाला", fullPrice: 170, halfPrice: 95, category: "भेज (Veg)" },
            { name: "पनीर चिल्ली", fullPrice: 180, halfPrice: 100, category: "भेज (Veg)" },
            { name: "मटर पनीर", fullPrice: 130, halfPrice: null, category: "भेज (Veg)" },
            { name: "कढ़ाई पनीर", fullPrice: 170, halfPrice: 95, category: "भेज (Veg)" },
            { name: "पनीर फ्राई राईस", fullPrice: 150, halfPrice: 80, category: "भेज (Veg)" },
            { name: "दाल फ्राई", fullPrice: 80, halfPrice: null, category: "भेज (Veg)" },
            { name: "आलु भुजिया", fullPrice: 80, halfPrice: null, category: "भेज (Veg)" },
            { name: "भेज मनचुरीयन", fullPrice: 120, halfPrice: 70, category: "भेज (Veg)" },
            { name: "मनचुरीयन ग्रेवी", fullPrice: 130, halfPrice: 75, category: "भेज (Veg)" },
            { name: "पनीर चिल्ली ड्राई", fullPrice: 170, halfPrice: 95, category: "भेज (Veg)" },
            { name: "भेज 65", fullPrice: 130, halfPrice: 80, category: "भेज (Veg)" },
            { name: "भेज चिल्ली", fullPrice: 130, halfPrice: 80, category: "भेज (Veg)" },
            { name: "तवा रोटी", fullPrice: 7, halfPrice: null, category: "रोटी और चावल", unit: "pc" },
            { name: "बटर रोटी", fullPrice: 10, halfPrice: null, category: "रोटी और चावल", unit: "pc" },
            { name: "सादा चावल", fullPrice: 40, halfPrice: 20, category: "रोटी और चावल" },
            { name: "चावल फ्राई", fullPrice: 60, halfPrice: 30, category: "रोटी और चावल" },
            { name: "चावल थाली", fullPrice: 70, halfPrice: null, category: "रोटी और चावल" },
            { name: "स्पेशल चावल थाली", fullPrice: 90, halfPrice: null, category: "रोटी और चावल" }
        ];

        let cart = [];
        function initOrderSystem() {
            menuItems = [...fullMenu];
            buildMenuWithSelectors();
            document.getElementById('placeOrderBtn').addEventListener('click', placeOrder);
            window.menuBuilt = true;
        }

        function buildMenuWithSelectors() {
            const container = document.getElementById('menuGrid');
            container.innerHTML = '';
            let currentCat = '';
            menuItems.forEach(item => {
                const isOutOfStock = outOfStockItems.includes(item.name);
                if (item.category !== currentCat) {
                    currentCat = item.category;
                    const catDiv = document.createElement('div');
                    catDiv.className = 'category-title';
                    catDiv.innerText = currentCat;
                    container.appendChild(catDiv);
                }
                const card = document.createElement('div');
                card.className = `menu-card ${isOutOfStock ? 'item-disabled' : ''}`;
                let fullSelector = '', halfSelector = '';
                if (item.fullPrice && !isOutOfStock) {
                    fullSelector = `
                        <div class="selector-group">
                            <span>Full</span>
                            <button class="qty-btn minus" data-item="${item.name}" data-type="full">−</button>
                            <span class="qty-value" id="qty-${item.name.replace(/\s/g, '')}-full">0</span>
                            <button class="qty-btn plus" data-item="${item.name}" data-type="full">+</button>
                        </div>
                    `;
                }
                if (item.halfPrice && !isOutOfStock) {
                    halfSelector = `
                        <div class="selector-group">
                            <span>Half</span>
                            <button class="qty-btn minus" data-item="${item.name}" data-type="half">−</button>
                            <span class="qty-value" id="qty-${item.name.replace(/\s/g, '')}-half">0</span>
                            <button class="qty-btn plus" data-item="${item.name}" data-type="half">+</button>
                        </div>
                    `;
                }
                card.innerHTML = `
                    <div class="item-name">${item.name} ${isOutOfStock ? '<span style="color:red; font-size:12px;">(Out of Stock)</span>' : ''}</div>
                    <div class="prices">
                        ${item.fullPrice ? `<span class="price-tag">Full: ₹${item.fullPrice}${item.unit ? `/${item.unit}` : ''}</span>` : ''}
                        ${item.halfPrice ? `<span class="price-tag">Half: ₹${item.halfPrice}</span>` : ''}
                    </div>
                    <div class="qty-selector">${fullSelector}${halfSelector}</div>
                `;
                container.appendChild(card);
            });
            // Attach events only if online and not out of stock (buttons already exist but disabled by CSS if out of stock)
            document.querySelectorAll('.qty-btn.plus').forEach(btn => {
                btn.removeEventListener('click', plusHandler);
                btn.addEventListener('click', plusHandler);
            });
            document.querySelectorAll('.qty-btn.minus').forEach(btn => {
                btn.removeEventListener('click', minusHandler);
                btn.addEventListener('click', minusHandler);
            });
            function plusHandler(e) { const btn = e.currentTarget; changeQuantity(btn.dataset.item, btn.dataset.type, 1); }
            function minusHandler(e) { const btn = e.currentTarget; changeQuantity(btn.dataset.item, btn.dataset.type, -1); }
            updateOfflineUI(); // re-apply disable if offline
        }

        function changeQuantity(itemName, type, delta) {
            const menuItem = menuItems.find(i => i.name === itemName);
            if (!menuItem) return;
            if (outOfStockItems.includes(itemName)) return;
            const price = type === 'full' ? menuItem.fullPrice : menuItem.halfPrice;
            if (!price) return;
            let existing = cart.find(i => i.name === itemName && i.type === type);
            let newQty = existing ? existing.qty + delta : (delta === 1 ? 1 : 0);
            if (newQty < 0) newQty = 0;
            if (newQty === 0) {
                cart = cart.filter(i => !(i.name === itemName && i.type === type));
            } else {
                if (existing) {
                    existing.qty = newQty;
                    existing.itemTotal = newQty * price;
                } else {
                    cart.push({ name: itemName, type, qty: newQty, price, itemTotal: newQty * price });
                }
            }
            const counterSpan = document.getElementById(`qty-${itemName.replace(/\s/g, '')}-${type}`);
            if (counterSpan) counterSpan.innerText = newQty;
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const cartDiv = document.getElementById('cartItemsList');
            let total = 0;
            if (cart.length === 0) {
                cartDiv.innerHTML = '<div class="cart-item">कोई आइटम नहीं चुना</div>';
            } else {
                cartDiv.innerHTML = cart.map(i => `<div class="cart-item"><span>${i.name} (${i.type}) x${i.qty}</span><span>₹${i.itemTotal}</span></div>`).join('');
                total = cart.reduce((sum, i) => sum + i.itemTotal, 0);
            }
            document.getElementById('totalPrice').innerText = total;
        }

        async function placeOrder() {
            if (!restaurantOnline) { alert("रेस्टोरेंट अभी बंद है। कृपया बाद में प्रयास करें।"); return; }
            if (cart.length === 0) { alert("कोई आइटम चुनें"); return; }
            const orderData = {
                customerMobile: currentCustomer.mobile,
                customerName: currentCustomer.name,
                items: cart,
                total: parseFloat(document.getElementById('totalPrice').innerText),
                status: "pending",
                createdAt: new Date().toISOString()
            };
            try {
                await addDoc(collection(db, "orders"), orderData);
                alert("✅ ऑर्डर भेज दिया!");
                cart = [];
                document.querySelectorAll('.qty-value').forEach(span => span.innerText = '0');
                updateCartDisplay();
            } catch(e) { alert("त्रुटि: " + e.message); }
        }

        function loadCustomerOrders(mobile) {
            if (unsubscribeOrders) unsubscribeOrders();
            const q = query(collection(db, "orders"), where("customerMobile", "==", mobile));
            unsubscribeOrders = onSnapshot(q, (snapshot) => {
                const ordersDiv = document.getElementById('ordersList');
                if (snapshot.empty) { ordersDiv.innerHTML = '<p>अभी कोई ऑर्डर नहीं</p>'; return; }
                let html = '';
                snapshot.forEach(docSnap => {
                    const order = docSnap.data();
                    const orderId = docSnap.id.slice(-6);
                    let statusClass = '', statusText = '';
                    if (order.status === 'pending') { statusClass = 'status-pending'; statusText = 'Pending Approval'; }
                    else if (order.status === 'approved') { statusClass = 'status-approved'; statusText = 'Approved - Being Prepared'; }
                    else if (order.status === 'ready') { statusClass = 'status-ready'; statusText = '✅ Ready for Pickup!'; }
                    const itemsHtml = order.items.map(i => `<li>${i.name} (${i.type}) x${i.qty} = ₹${i.itemTotal}</li>`).join('');
                    html += `<div class="order-history-card ${order.status}">
                        <div style="display:flex; justify-content:space-between;"><strong>Order #${orderId}</strong><span class="status-badge ${statusClass}">${statusText}</span></div>
                        <div><strong>Items:</strong><ul style="margin-left:20px;">${itemsHtml}</ul></div>
                        <div style="text-align:right; font-weight:bold;">Total: ₹${order.total}</div>
                        <div style="font-size:12px; color:#888;">${new Date(order.createdAt).toLocaleString()}</div>
                    </div>`;
                });
                ordersDiv.innerHTML = html;
            });
        }
    </script>
</head>
<body>
<div class="container">
    <div id="authContainer">
        <div class="auth-card" id="step1">
            <h2>🍽️ खाना खजाना</h2>
            <p>मोबाइल नंबर डालें</p>
            <div class="input-group"><input type="tel" id="mobileNumber" placeholder="10 अंक" maxlength="10"></div>
            <button id="continueBtn" class="btn-primary">Continue</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
        <div class="auth-card" id="step2Login" style="display:none;">
            <h2>लॉगिन</h2>
            <div class="input-group"><input type="password" id="loginPassword" placeholder="पासवर्ड"></div>
            <button id="loginSubmitBtn" class="btn-primary">लॉगिन करें</button>
            <button id="backToMobile" class="back-link">← वापस</button>
            <div id="loginError" class="error-msg"></div>
        </div>
        <div class="auth-card" id="step3Signup" style="display:none;">
            <h2>साइनअप</h2>
            <div class="input-group"><input type="text" id="signupName" placeholder="पूरा नाम"></div>
            <div class="input-group"><input type="password" id="signupPassword" placeholder="पासवर्ड (6+ अक्षर)"></div>
            <button id="signupSubmitBtn" class="btn-primary">साइनअप करें</button>
            <button id="backToMobileFromSignup" class="back-link">← वापस</button>
            <div id="signupError" class="error-msg"></div>
        </div>
    </div>

    <div id="orderContainer" style="display:none;">
        <div class="resto-header">
            <div class="logo"><h1>खाना खजाना</h1><p>सिंहवाड़ा (Pickup Only)</p></div>
            <div class="welcome-section"><span id="welcomeUser"></span><button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button></div>
        </div>
        <div id="offlineBanner" class="offline-banner" style="display:none;">⚠️ रेस्टोरेंट अभी बंद है। ऑर्डर नहीं लिए जा रहे हैं।</div>
        <div id="menuGrid" class="menu-grid"></div>
        <div class="cart-section">
            <div class="cart-title"><i class="fas fa-shopping-cart"></i> आपका ऑर्डर</div>
            <div id="cartItemsList" class="cart-items-list"></div>
            <div class="total-row">कुल: ₹<span id="totalPrice">0</span></div>
            <button id="placeOrderBtn" class="btn-primary"><i class="fas fa-check-circle"></i> ऑर्डर करें (Pickup)</button>
        </div>
        <div class="orders-history">
            <h3><i class="fas fa-history"></i> मेरे ऑर्डर</h3>
            <div id="ordersList"></div>
        </div>
        <footer style="text-align:center; margin-top:30px; color:#888;">© खाना खजाना | Pickup only</footer>
    </div>
</div>
</body>
